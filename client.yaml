apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: criu-svc-test
spec:
  containers:
    - name: client
      image: curlimages/curl:8.6.0
      command:
        - sh
        - -c
        - |
          i=0
          while true; do
            ts=$(date +%s.%N)
            out=$(curl -sS --max-time 1 -w " http_code=%{http_code} time_total=%{time_total}" http://criu-server-svc.criu-svc-test.svc.cluster.local/ 2>&1)
            rc=$?
            echo "$ts seq=$i rc=$rc $out"
            i=$((i+1))
            sleep 0.1
          done